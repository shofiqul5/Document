<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Code Generator</title>
<style>
:root{--bg:#eef0f7;--card:#fff;--tx:#1b1e28;--mu:#7a8094;--bd:#e1e4ee;--ac:#4f46e5;--acx:#fff;--sh:0 10px 40px rgba(40,40,90,.10);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101117;--card:#1b1d27;--tx:#eceef5;--mu:#8f95aa;--bd:#2f3246;--ac:#8b85ff;--acx:#10101a;--sh:0 10px 40px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101117;--card:#1b1d27;--tx:#eceef5;--mu:#8f95aa;--bd:#2f3246;--ac:#8b85ff;--acx:#10101a;--sh:0 10px 40px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:420px;margin:0 auto;padding:24px 16px 40px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:16px}
.prev{display:flex;justify-content:center}
canvas{width:100%;max-width:300px;aspect-ratio:1;height:auto;border-radius:14px;border:1px solid var(--bd);transition:opacity .15s}
textarea{width:100%;min-height:84px;padding:14px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;resize:none;outline:none;transition:border-color .15s,box-shadow .15s}
textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.opts{display:flex;gap:10px;align-items:center}
select{flex:1;height:44px;padding:0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.sw{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);overflow:hidden;flex:none}
.sw input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);border:0;padding:0;cursor:pointer;background:none}
button{height:50px;border:0;border-radius:14px;background:var(--ac);color:var(--acx);font:inherit;font-weight:600;cursor:pointer;transition:transform .1s,opacity .15s}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#ov .box{background:var(--card);border-radius:20px;padding:16px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
#ov img{width:100%;border-radius:10px;border:1px solid var(--bd);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#ov p{margin:0;color:var(--mu);font-size:.9rem}
.abtn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--ac);color:var(--acx);font-weight:600;text-decoration:none}
.cls{width:100%;height:44px;background:transparent;color:var(--mu)}
.btns{display:flex;gap:10px}.btns button{flex:1}.btns .sec{flex:none;width:90px;background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.msg{text-align:center;font-size:.85rem;color:var(--mu);min-height:1.3em;margin-top:-6px}
.err{color:#d6336c}
</style>
</head>
<body>
<main>
<div class="card">
<div class="prev"><canvas id="c" width="600" height="600"></canvas></div>
<textarea id="t" placeholder="Link or text" spellcheck="false">https://example.com</textarea>
<div class="opts">
<select id="ec" aria-label="Error correction"><option value="L">Low</option><option value="M">Medium</option><option value="Q" selected>High</option><option value="H">Max</option></select>
<div class="sw" title="QR color"><input id="fg" type="color" value="#000000" aria-label="QR color"></div>
<div class="sw" title="Background"><input id="bgc" type="color" value="#ffffff" aria-label="Background color"></div>
</div>
<div class="btns"><button id="dl">Download 4K PNG</button><button id="dls" class="sec">SVG</button></div>
<div class="msg" id="m"></div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var t=$('t'),ec=$('ec'),fg=$('fg'),bgc=$('bgc'),cv=$('c'),m=$('m'),dl=$('dl'),dls=$('dls');
var SIZE=3840,MG=4;
function say(s,e){m.textContent=s;m.className='msg'+(e?' err':'')}
function build(){
  if(!t.value)return null;
  if(typeof qrcode==='undefined'){say('QR library failed to load.',1);return null}
  try{
    qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
    var q=qrcode(0,ec.value);
    q.addData(t.value,'Byte');
    q.make();
    return q;
  }catch(e){say('Text is too long.',1);return null}
}
function draw(canvas,px,q){
  var n=q.getModuleCount(),tot=n+2*MG;
  var ms=Math.max(1,Math.floor(px/tot));
  var off=Math.floor((px-ms*tot)/2);
  canvas.width=px;canvas.height=px;
  var x=canvas.getContext('2d');
  x.fillStyle=bgc.value;x.fillRect(0,0,px,px);
  x.fillStyle=fg.value;
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)
    if(q.isDark(r,c))x.fillRect(off+(c+MG)*ms,off+(r+MG)*ms,ms,ms);
}
function render(){
  var q=build();
  dl.disabled=dls.disabled=!q;
  if(!q){cv.style.opacity=.3;return}
  cv.style.opacity=1;say('');
  draw(cv,600,q);
}
[t,ec,fg,bgc].forEach(function(e){e.addEventListener('input',render)});
var cap=null;
function showOv(url,name){
  var o=document.getElementById('ov');if(o)o.remove();
  o=document.createElement('div');o.id='ov';
  var box=document.createElement('div');box.className='box';
  var im=new Image();im.src=url;im.alt='QR';
  var h=document.createElement('p');h.textContent='Press and hold the image \u2192 Save image';
  var a=document.createElement('a');a.href=url;a.download=name;a.textContent='Save';a.className='abtn';
  var x=document.createElement('button');x.textContent='Close';x.className='cls';
  x.onclick=function(){o.remove()};
  o.onclick=function(e){if(e.target===o)o.remove()};
  box.appendChild(im);box.appendChild(h);box.appendChild(a);box.appendChild(x);
  o.appendChild(box);document.body.appendChild(o);
}
var ls={save:function(r){
  var u=URL.createObjectURL(r.data),a=document.createElement('a');
  a.href=u;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},5000);
  return Promise.resolve({status:'saved'});
}};
var fb={save:function(r){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){showOv(fr.result,r.filename);res({status:'saved',fallback:true})};
    fr.onerror=function(){rej({code:'error',message:'could not read file'})};
    fr.readAsDataURL(r.data);
  });
}};
function getCap(){
  if(cap)return Promise.resolve(cap);
  if(!window.claude||!window.claude.use)return Promise.resolve(ls);
  return window.claude.use('downloads').then(function(d){cap=d||fb;return cap}).catch(function(){return fb});
}
function doSave(d,name,data){
  return d.save({filename:name,data:data}).then(function(r){say(r&&r.fallback?'':'Saved ✓')}).catch(function(e){
    if(e&&e.code==='declined'){say('Cancelled.');return}
    say('Save failed: '+((e&&e.code)||'error')+((e&&e.message)?' – '+e.message:''),1);
  });
}
dls.addEventListener('click',function(){
  var q=build();if(!q)return;
  var n=q.getModuleCount(),tot=n+2*MG,p='';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))p+='M'+(c+MG)+' '+(r+MG)+'h1v1h-1z';
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+tot+' '+tot+'" width="'+SIZE+'" height="'+SIZE+'"><rect width="'+tot+'" height="'+tot+'" fill="'+bgc.value+'"/><path d="'+p+'" fill="'+fg.value+'"/></svg>';
  getCap().then(function(d){
    if(!d){say('Download unavailable in this view.',1);return}
    return doSave(d,'qr-code.svg',new Blob([svg],{type:'image/svg+xml'}));
  });
});
dl.addEventListener('click',function(){
  var q=build();if(!q)return;
  dl.disabled=true;say('Preparing…');
  setTimeout(function(){
    var big=document.createElement('canvas');
    draw(big,SIZE,q);
    big.toBlob(function(b){
      dl.disabled=false;
      if(!b){say('Could not create image.',1);return}
      getCap().then(function(d){
        if(!d){say('Download unavailable in this view.',1);return}
        return doSave(d,'qr-code-4k.png',b);
      });
    },'image/png');
  },30);
});
render();
})();
</script>
</body>
</html>
