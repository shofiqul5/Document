<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Files</title>
    <style>
        :root {
            --mist: #eef0fb;
            --paper: #ffffff;
            --ink: #232a5c;
            --muted: #5d648f;
            --line: #cfd3ee;
            --accent: #3ddc97;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--mist);
            color: var(--ink);
            min-height: 100vh;
            display: grid;
            grid-template-columns: 280px 1fr;
        }

        aside {
            background: var(--ink);
            color: var(--mist);
            padding: 40px 28px;
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .logo { width: 56px; height: 56px; }

        .search { position: relative; }
        .search svg {
            position: absolute;
            left: 16px;
            top: 50%;
            width: 20px;
            height: 20px;
            transform: translateY(-50%);
            color: #a9b0dc;
            pointer-events: none;
        }

        #search-input {
            width: 100%;
            padding: 14px 18px 14px 46px;
            font-size: 16px;
            color: var(--mist);
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            transition: background 0.2s, border-color 0.2s;
        }
        #search-input::placeholder { color: #a9b0dc; }
        #search-input:hover { border-color: rgba(255, 255, 255, 0.45); }
        #search-input:focus-visible {
            outline: none;
            color: var(--ink);
            background: var(--paper);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(61, 220, 151, 0.45);
        }
        #search-input:focus-visible::placeholder { color: var(--muted); }
        .search:focus-within svg { color: var(--ink); }

        .contact {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 18px;
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
            text-decoration: none;
            background: var(--accent);
            border-radius: 999px;
            transition: background 0.2s;
        }
        .contact svg { width: 20px; height: 20px; }
        .contact:hover { background: #ffffff; }
        .contact:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }

        main { padding: 40px 32px 64px; }

        #file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 28px 24px;
        }

        .tile {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            min-height: 150px;
            padding: 18px 22px;
            color: #ffffff;
            text-decoration: none;
            background: var(--ink);
            border-radius: 16px;
            box-shadow: 0 6px 0 #141a3d, 0 10px 24px rgba(35, 42, 92, 0.25);
            overflow-wrap: anywhere;
            transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
        }
        .tile:hover, .tile:focus-visible {
            transform: translateY(-4px);
            background: #313a7a;
            box-shadow: 0 10px 0 #141a3d, 0 16px 28px rgba(35, 42, 92, 0.3);
            outline: none;
        }
        .tile:focus-visible { box-shadow: 0 0 0 3px var(--mist), 0 0 0 6px var(--ink); }

        .tile .icon { width: 60px; height: 60px; color: #ffffff; }
        .tile .icon .fill { fill: var(--accent); }
        .tile .icon .fold { fill: none; }
        .tile strong { font-size: 18px; line-height: 1.25; }

        .hidden { display: none !important; }

        #loading { display: flex; justify-content: center; padding: 48px; }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--line);
            border-top-color: var(--ink);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

        #error, .no-results {
            padding: 24px;
            background: var(--paper);
            border-left: 6px solid var(--accent);
        }
        .no-results { grid-column: 1 / -1; }
        #error small { color: var(--muted); }

        @media (max-width: 760px) {
            body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            aside { position: static; height: auto; padding: 28px 20px; }
            .contact { margin-top: 0; }
            main { padding: 36px 20px 48px; }
        }
    </style>
</head>
<body>
    <aside>
        <svg class="logo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true"><path d="M6 18a4 4 0 0 1 4-4h14l6 7h24a4 4 0 0 1 4 4v25a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4Z" fill="#3ddc97" stroke="#eef0fb"/></svg>
        <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="text" id="search-input" placeholder="Search" autocomplete="off" aria-label="Search files">
        </div>

        <a class="contact" href="https://shofiqul5.github.io" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            Contact
        </a>
    </aside>

    <main>
        <div id="loading" role="status" aria-label="Loading"><span class="spinner"></span></div>
        <div id="error" class="hidden"></div>
        <div id="file-list" class="hidden"></div>
    </main>

    <script>
        // --- Configuration ---
        // এই নামের ফাইল/ফোল্ডার তালিকায় দেখাবে না (ডট দিয়ে শুরু হওয়া নামও দেখাবে না)
        const ignore = ['index.html', 'files.json', 'generate-files.js', '_headers', '_redirects', '_worker.js', 'functions', 'node_modules'];
        // --- End Configuration ---

        let allItems = [];

        const FOLDER_ICON = '<svg class="icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 18a4 4 0 0 1 4-4h14l6 7h24a4 4 0 0 1 4 4v25a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4Z" class="fill"/><path d="M6 30h52"/></svg>';
        const FILE_ICON = '<svg class="icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M14 6h26l12 12v34a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4Z" class="fill"/><path d="M40 6v12h12" class="fold"/><path d="M20 32h24M20 42h24"/></svg>';

        function clean(items) {
            return items
                .filter(i => i.name && !i.name.startsWith('.') && !ignore.includes(i.name))
                .sort((a, b) => (a.type === b.type ? 0 : a.type === 'dir' ? -1 : 1) || a.name.localeCompare(b.name));
        }

        // ১ম পদ্ধতি: files.json (যেকোনো হোস্টিংয়ে কাজ করে)
        async function fromManifest() {
            const res = await fetch('files.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('files.json not found');
            const data = await res.json();
            if (!Array.isArray(data)) throw new Error('Invalid files.json');
            return data.map(i => typeof i === 'string'
                ? { name: i.replace(/\/$/, ''), type: i.endsWith('/') ? 'dir' : 'file' }
                : { name: i.name, type: i.type === 'dir' ? 'dir' : 'file' });
        }

        // ২য় পদ্ধতি: সার্ভারের নিজের directory listing পড়া (Apache/nginx autoindex, লোকাল সার্ভার ইত্যাদি)
        async function fromDirectoryListing() {
            const res = await fetch('./', { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
            const items = [];
            doc.querySelectorAll('a[href]').forEach(a => {
                const href = a.getAttribute('href');
                if (!href || /^([a-z]+:|\/|\?|#|\.\.)/i.test(href)) return;
                const isDir = href.endsWith('/');
                const name = decodeURIComponent(href.replace(/\/$/, ''));
                if (name.includes('/')) return;
                items.push({ name, type: isDir ? 'dir' : 'file' });
            });
            if (items.length === 0) throw new Error('No directory listing');
            return items;
        }

        async function loadItems() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const list = document.getElementById('file-list');
            const searchInput = document.getElementById('search-input');

            try {
                let items;
                try { items = await fromManifest(); }
                catch (e) { items = await fromDirectoryListing(); }

                allItems = clean(items);
                loading.classList.add('hidden');
                list.classList.remove('hidden');
                render(allItems);

                searchInput.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase().trim();
                    render(allItems.filter(i => i.name.toLowerCase().includes(term)));
                });
            } catch (err) {
                console.error(err);
                loading.classList.add('hidden');
                error.classList.remove('hidden');
                error.textContent = '';
                error.append('Failed to load', document.createElement('br'));
                const small = document.createElement('small');
                small.textContent = 'files.json not found. Run: node generate-files.js';
                error.appendChild(small);
            }
        }

        function render(items) {
            const list = document.getElementById('file-list');
            list.innerHTML = '';

            if (items.length === 0) {
                list.innerHTML = '<div class="no-results">No results</div>';
                return;
            }

            items.forEach(item => {
                const a = document.createElement('a');
                a.className = 'tile';
                a.href = encodeURIComponent(item.name) + (item.type === 'dir' ? '/' : '');
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.insertAdjacentHTML('beforeend', item.type === 'dir' ? FOLDER_ICON : FILE_ICON);

                const name = document.createElement('strong');
                name.textContent = item.name;
                a.appendChild(name);

                list.appendChild(a);
            });
        }

        loadItems();
    </script>
</body>
</html>
