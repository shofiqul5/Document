<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bot Messenger</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--side:#fff;--bg:#e8edf2;--txt:#111418;--muted:#8a909a;--acc:#2f8cf0;--in:#fff;--out:#2f8cf0;--bd:#ececf0;--hov:#f2f3f5}
@media(prefers-color-scheme:dark){:root{--side:#16191f;--bg:#0b0e13;--txt:#eceef1;--muted:#8a919c;--acc:#4c9bff;--in:#1f242c;--out:#2f8cf0;--bd:#252a33;--hov:#1e232b}}
*{box-sizing:border-box;scrollbar-width:thin}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;background:var(--side);color:var(--txt);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit;color:var(--txt);outline:none}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.ib{background:none;border:0;font-size:21px;width:40px;height:40px;border-radius:50%;color:var(--muted);flex:none}
.ib:hover{background:var(--hov)}

/* login */
#login{display:flex;align-items:center;justify-content:center;height:100%;padding:16px;background:var(--bg)}
.card{width:100%;max-width:340px;text-align:center}
.logo{width:84px;height:84px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 24px}
.card input,.card textarea{width:100%;padding:14px 16px;border:1px solid var(--bd);border-radius:12px;background:var(--side);margin-bottom:10px;resize:none;text-align:left}
.card input:focus,.card textarea:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:13px 16px;width:100%;font-weight:600}
.btn.ghost{background:none;color:var(--muted);margin-top:4px}
.btn:disabled{opacity:.6}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.note{color:var(--muted);font-size:13px;line-height:1.5;margin:12px 0}
.note.w{color:#b26a00}
.err{color:#e53935;font-size:13px;min-height:1.2em;margin-top:6px}
#modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .card{background:var(--side);padding:22px;border-radius:18px}

/* layout */
#app{display:none;height:100dvh;grid-template-columns:360px 1fr}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--bd);position:relative;background:var(--side)}
.sh{display:flex;align-items:center;gap:6px;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
#q{flex:1;border:0;background:var(--hov);border-radius:12px;padding:11px 14px}
#warn,#gbar{display:none;align-items:center;justify-content:space-between;gap:8px;font-size:13px;padding:8px 12px}
#warn{background:#fff3cd;color:#664d03}
#gbar{background:var(--hov);color:var(--muted)}
#warn button,#gbar button{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:5px 12px;flex:none}
#list{flex:1;overflow-y:auto}
.item{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.item:hover{background:var(--hov)}
.item.on{background:var(--acc);color:#fff}.item.on small,.item.on .t{color:#ffffffcc}
.av{width:50px;height:50px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:19px;background-size:cover;background-position:center}
.mid{flex:1;min-width:0}
.l1,.l2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.l1 b,.l2 small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t,small{color:var(--muted);font-size:12px}.l2 small{font-size:14px;margin-top:2px}
.bdg{background:var(--acc);color:#fff;border-radius:99px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px;flex:none;font-weight:600}
.item.on .bdg{background:#fff;color:var(--acc)}
.empty{color:var(--muted);text-align:center;padding:30px 20px;font-size:14px}
#fab{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:22px;box-shadow:0 3px 12px #0003}

/* chat */
.main{display:flex;flex-direction:column;min-height:0;background:var(--bg);min-width:0}
.mh{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#back{display:none;background:var(--side);box-shadow:0 1px 6px #0002;color:var(--txt)}
.hp{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--side);border-radius:99px;padding:5px 18px 5px 5px;box-shadow:0 1px 6px #0002}
.hp .av{width:40px;height:40px;font-size:16px}
.ht{flex:1;min-width:0}.ht b,.ht small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgs{flex:1;overflow-y:auto;padding:6px 14px 10px;display:flex;flex-direction:column;gap:3px}
.chip{align-self:center;color:var(--muted);font-size:12px;padding:2px 10px;margin:12px 0 6px}
.row{display:flex;justify-content:flex-start;max-width:100%}
.row.out{justify-content:flex-end}
.b{max-width:min(82%,520px);background:var(--in);border-radius:18px;padding:8px 12px 6px;cursor:pointer;word-break:break-word;min-width:64px;line-height:1.4;box-shadow:0 1px 0 var(--bd)}
.row:not(.out) .b{border-bottom-left-radius:6px}
.out .b{background:var(--out);color:#fff;border-bottom-right-radius:6px}
.nm{font-weight:600;font-size:13px;margin-bottom:2px}
.q{border-left:3px solid var(--acc);background:#2f8cf01a;padding:3px 9px;margin:0 0 6px;border-radius:6px;font-size:13px}
.out .q{border-color:#fff;background:#ffffff26}
.q b{display:block;color:var(--acc)}.out .q b{color:#fff}
.q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.tx{white-space:pre-wrap}
.tm{float:right;font-size:11px;color:var(--muted);margin:6px 0 0 10px}.out .tm{color:#ffffffc0}
.b:after{content:"";display:block;clear:both}
.md{display:block;max-width:100%;border-radius:12px;margin:0 0 4px}
.md.photo,.md.animation,.md.video{width:320px;max-width:100%;min-height:80px;background:var(--hov)}
.md.sticker{width:170px;background:none}
.md.video_note{width:210px;height:210px;border-radius:50%;object-fit:cover}
.md.voice,.md.audio{width:240px;max-width:100%}
a.md{color:inherit;text-decoration:underline}
.se{font-size:64px}
.warnm{color:var(--muted);font-size:13px;padding:6px 0}

.compose{display:none;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px))}
#rbar{display:none;align-items:center;gap:8px;padding:0 0 6px 6px}
#rbar .q{flex:1;margin:0;min-width:0;background:var(--side)}
.crow{display:flex;gap:8px;align-items:flex-end}
#inp{flex:1;border:0;background:var(--side);border-radius:24px;padding:13px 18px;resize:none;max-height:140px;line-height:1.3;box-shadow:0 1px 6px #0002}
#send{width:48px;height:48px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
#send:disabled{opacity:.6}
#ph{display:none;flex:1;align-items:center;justify-content:center;color:var(--muted)}
.main.none .mh,.main.none #msgs,.main.none .compose{display:none!important}
.main.none #ph{display:flex}

#pop{display:none;position:fixed;z-index:30;background:var(--side);border-radius:14px;box-shadow:0 8px 32px #0003;padding:6px;min-width:200px;animation:up .12s ease}
#pop div{padding:9px 14px;border-radius:9px;cursor:pointer}#pop div:hover{background:var(--hov)}
#pop .h{cursor:default;color:var(--muted);font-size:13px}#pop .h:hover{background:none}#pop .d{color:#e53935}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:40;font-size:14px;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media(max-width:760px){#app{grid-template-columns:1fr}.main{display:none}body.co .side{display:none}body.co .main{display:flex}#back{display:block}.b{max-width:86%}}
</style>
</head>
<body>

<div id="login"><div class="card">
 <div class="logo">🤖</div>
 <div id="s1">
  <button class="btn gbtn" id="gsi"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Sign in with Google</button>
  <p class="note">Your chats are encrypted </p>
 </div>
 <div id="s2" style="display:none">
  <p class="note" id="ptitle"></p>
  <input id="pp" type="password" placeholder="Passphrase" autocomplete="off">
  <input id="pp2" type="password" placeholder="Repeat passphrase" autocomplete="off">
  <button class="btn" id="pgo">Continue</button>
  <p class="note w">If you forget this passphrase, your backup cannot be recovered.</p>
 </div>
 <div id="s3" style="display:none">
  <input id="tok" placeholder="Bot token" autocomplete="off" spellcheck="false">
  <button class="btn" id="go">Connect</button>
 </div>
 <div class="err" id="lerr"></div>
</div></div>

<div id="app">
 <aside class="side">
  <div class="sh"><input id="q" placeholder="Search"><button class="ib" id="m1">⋮</button></div>
  <div id="warn"><span>Webhook is on</span><button id="dw">Remove</button></div>
  <div id="gbar"><span>☁ Not backed up to Google Drive</span><button id="gc">Connect</button></div>
  <div id="list"></div>
  <button id="fab" title="New message">✎</button>
 </aside>
 <main class="main none" id="main">
  <div class="mh"><button class="ib" id="back">←</button><div class="hp"><div id="hav"></div><div class="ht"><b id="ct"></b><small id="cs"></small></div></div></div>
  <div id="msgs"></div>
  <div class="compose" id="compose">
   <div id="rbar"><div class="q"><b id="rn"></b><span id="rt"></span></div><button class="ib" id="rx">✕</button></div>
   <div class="crow"><textarea id="inp" rows="1" placeholder="Message"></textarea><button id="send"><svg viewBox="0 0 24 24" width="22" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button></div>
  </div>
  <div id="ph">Select a chat</div>
 </main>
</div>

<div id="pop"></div><div id="toast"></div>
<div id="modal"><div class="card">
 <input id="nto" placeholder="Chat ID or @username"><textarea id="ntx" rows="3" placeholder="Message"></textarea>
 <button class="btn" id="nsend">Send</button><button class="btn ghost" id="ncancel">Cancel</button><div class="err" id="nerr"></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const COL=['#e17076','#faa774','#a695e7','#7bc862','#6ec9cb','#65aadd','#ee7aae'];
const LBL={photo:'📷 Photo',sticker:'🙂 Sticker',tgs:'🙂 Sticker',animation:'GIF',video:'🎬 Video',video_note:'🎥 Video message',voice:'🎤 Voice message',audio:'🎵 Audio',doc:'📎 File'};
const DM={animation:'video/mp4',video:'video/mp4',video_note:'video/mp4',voice:'audio/ogg',audio:'audio/mpeg',document:'application/octet-stream'};
let token='',me=null,data={chats:{},offset:0},active=null,replyTo=null,polling=false,ctrl=null,files={},avs={},pend={};

/* ---------- Telegram ---------- */
async function api(method,params={},signal){
  const r=await fetch('https://api.telegram.org/bot'+token+'/'+method,{method:'POST',body:new URLSearchParams(params),signal});
  const j=await r.json();if(!j.ok)throw new Error(j.description||'Error');return j.result;
}
const inflight={};
function fileUrl(fid,mime){
  if(files[fid])return Promise.resolve(files[fid]);
  return inflight[fid]||(inflight[fid]=(async()=>{
    try{
      const f=await api('getFile',{file_id:fid}),url='https://api.telegram.org/file/bot'+token+'/'+f.file_path;
      try{const r=await fetch(url);if(!r.ok)throw 0;return files[fid]=URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:mime||'application/octet-stream'}))}
      catch(e){return files[fid]=url}
    }finally{delete inflight[fid]}
  })());
}
const name=u=>u?([u.first_name,u.last_name].filter(Boolean).join(' ')||u.title||u.username||'Unknown'):'Unknown';
const tm=ts=>new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const dayOf=ts=>{const d=new Date(ts),n=new Date(),y=new Date(Date.now()-864e5);return d.toDateString()===n.toDateString()?'Today':d.toDateString()===y.toDateString()?'Yesterday':d.toLocaleDateString('en-US',{month:'long',day:'numeric'})};
const prev=m=>m.media?LBL[m.media.t]+(m.text?' '+m.text:''):m.text;

function mediaOf(m){
  if(m.photo)return{t:'photo',f:m.photo[m.photo.length-1].file_id,mime:'image/jpeg'};
  const s=m.sticker;if(s)return s.is_animated?{t:'tgs',emoji:s.emoji}:{t:'sticker',f:s.file_id,v:s.is_video,mime:s.is_video?'video/webm':'image/webp'};
  for(const k of['animation','video','video_note','voice','audio','document']){const o=m[k];if(o)return{t:k==='document'?'doc':k,f:o.file_id,mime:o.mime_type||DM[k],name:o.file_name}}
  return null;
}
const extra=m=>m.location?'📍 Location':m.contact?'👤 '+name(m.contact):m.poll?'📊 '+m.poll.question:'';
const rp=r=>r.text||r.caption||(mediaOf(r)?LBL[mediaOf(r).t]:'Message');
const ensure=ch=>data.chats[String(ch.id)]||(data.chats[String(ch.id)]={title:ch.title||name(ch),type:ch.type,msgs:[],unread:0});

function handle(u){
  data.offset=u.update_id+1;
  const m=u.message||u.edited_message||u.channel_post||u.edited_channel_post;if(!m)return;
  const id=String(m.chat.id),isEdit=!!(u.edited_message||u.edited_channel_post),text=m.text||m.caption||extra(m),media=mediaOf(m);
  if(isEdit){const old=data.chats[id]&&data.chats[id].msgs.find(x=>x.id===m.message_id&&!x.out);if(old){old.text=text;old.edited=1}return}
  if(!text&&!media)return;
  const c=ensure(m.chat);
  c.msgs.push({id:m.message_id,from:m.from?name(m.from):(m.sender_chat?m.sender_chat.title:c.title),uid:m.from?m.from.id:m.chat.id,text,media,date:m.date*1000,out:false,reply:m.reply_to_message?{from:name(m.reply_to_message.from||m.reply_to_message.chat),t:rp(m.reply_to_message)}:null});
  if(id!==active)c.unread++;
}
async function poll(){
  if(polling)return;polling=true;
  while(polling){
    try{
      ctrl=new AbortController();
      const ups=await api('getUpdates',{offset:data.offset,timeout:25,allowed_updates:JSON.stringify(['message','edited_message','channel_post','edited_channel_post'])},ctrl.signal);
      $('warn').style.display='none';
      if(ups.length){ups.forEach(handle);save();render()}
    }catch(e){
      if(!polling)break;
      if(/webhook/i.test(e.message)){$('warn').style.display='flex';polling=false;break}
      await new Promise(r=>setTimeout(r,3000));
    }
  }
}

/* ---------- UI ---------- */
function paint(d,u){d.style.backgroundImage='url('+u+')';d.textContent=''}
function av(key,label,seed){
  const d=el('div','av',(label[0]||'?').toUpperCase());d.dataset.av=key;d.style.backgroundColor=COL[Math.abs(Number(seed)||0)%COL.length];
  if(key in avs){if(avs[key])paint(d,avs[key])}else loadAv(key);
  return d;
}
async function loadAv(key){
  if(pend[key])return;pend[key]=1;let u=null;
  try{const c=await api('getChat',{chat_id:key.slice(2)});if(c.photo&&c.photo.small_file_id)u=await fileUrl(c.photo.small_file_id,'image/jpeg')}catch(e){}
  avs[key]=u;if(u)document.querySelectorAll('[data-av="'+key+'"]').forEach(d=>paint(d,u));
}
function mediaEl(md){
  if(md.t==='tgs')return el('div','se',md.emoji||'🙂');
  const isAud=md.t==='voice'||md.t==='audio',isImg=md.t==='photo'||(md.t==='sticker'&&!md.v);
  const n=document.createElement(md.t==='doc'?'a':isAud?'audio':isImg?'img':'video');
  n.className='md '+md.t;
  if(md.t==='doc')n.textContent='📎 '+(md.name||'File');
  else if(n.tagName==='VIDEO'){n.playsInline=true;if(md.t==='animation'||md.t==='sticker'){n.autoplay=n.loop=n.muted=true}else n.controls=true}
  else if(isAud)n.controls=true;
  const go=u=>{if(md.t==='doc'){n.href=u;n.download=md.name||'file'}else n.src=u};
  const fail=()=>n.replaceWith(el('div','warnm','Unavailable'));n.onerror=fail;
  if(files[md.f])go(files[md.f]);else fileUrl(md.f,md.mime).then(go).catch(fail);
  return n;
}
function render(){renderList();renderMsgs()}
function renderList(){
  const l=$('list'),q=$('q').value.toLowerCase();l.innerHTML='';
  Object.entries(data.chats).filter(([i,c])=>c.title.toLowerCase().includes(q)).map(([id,c])=>({id,c,last:c.msgs[c.msgs.length-1]}))
   .sort((a,b)=>(b.last?.date||0)-(a.last?.date||0)).forEach(({id,c,last})=>{
    const d=el('div','item'+(id===active?' on':'')),mid=el('div','mid'),a=el('div','l1'),b=el('div','l2');
    a.append(el('b','',c.title),el('span','t',last?(dayOf(last.date)==='Today'?tm(last.date):dayOf(last.date)):''));
    b.append(el('small','',last?(last.out?'You: ':'')+(prev(last)||'').replace(/\n/g,' '):''));
    if(c.unread)b.append(el('span','bdg',c.unread));
    mid.append(a,b);d.append(av('c:'+id,c.title,id),mid);d.onclick=()=>openChat(id);l.append(d);
  });
  if(!l.children.length)l.append(el('p','empty','No chats yet. Messages sent to your bot will show up here.'));
}
function renderMsgs(){
  if(active===null||!data.chats[active])return;
  const c=data.chats[active],box=$('msgs');c.unread=0;
  $('hav').replaceChildren(av('c:'+active,c.title,active));$('ct').textContent=c.title;$('cs').textContent='ID '+active;
  const atEnd=box.dataset.chat!==active||box.scrollHeight-box.scrollTop-box.clientHeight<90;
  box.innerHTML='';box.dataset.chat=active;
  const grp=/group/.test(c.type);let last='';
  c.msgs.forEach(m=>{
    const dl=dayOf(m.date);if(dl!==last){last=dl;box.append(el('div','chip',dl))}
    const row=el('div','row'+(m.out?' out':'')),b=el('div','b');
    if(grp&&!m.out){const n=el('div','nm',m.from);n.style.color=COL[m.uid%COL.length];b.append(n)}
    if(m.reply){const q=el('div','q');q.append(el('b','',m.reply.from),el('span','',m.reply.t));b.append(q)}
    if(m.media)b.append(mediaEl(m.media));
    if(m.text)b.append(el('div','tx',m.text));
    b.append(el('span','tm',(m.edited?'edited ':'')+tm(m.date)+(m.out?' ✓✓':'')));
    b.onclick=b.oncontextmenu=e=>{if(e.target.closest('audio,video,a'))return;e.preventDefault();e.stopPropagation();msgMenu(m,e.clientX,e.clientY)};
    row.append(b);box.append(row);
  });
  if(atEnd)box.scrollTop=box.scrollHeight;
}
function openChat(id){
  if(active===null&&innerWidth<=760)history.pushState({c:1},'');
  active=id;replyTo=null;$('rbar').style.display='none';
  $('main').classList.remove('none');$('compose').style.display='block';
  document.body.classList.add('co');render();save(1);
}
function closeChat(){
  active=null;replyTo=null;$('rbar').style.display='none';
  document.body.classList.remove('co');$('main').classList.add('none');$('msgs').dataset.chat='';renderList();
}
$('back').onclick=()=>{if(history.state&&history.state.c)history.back();else closeChat()};
addEventListener('popstate',()=>{if(active!==null)closeChat()});
$('q').oninput=renderList;

function popup(items,x,y){
  const p=$('pop');p.innerHTML='';
  items.forEach(i=>{const d=el('div',i.h?'h':i.d?'d':'',i.t);if(i.f)d.onclick=i.f;p.append(d)});
  p.style.display='block';
  p.style.left=Math.max(8,Math.min(x,innerWidth-p.offsetWidth-8))+'px';p.style.top=Math.max(8,Math.min(y,innerHeight-p.offsetHeight-8))+'px';
}
document.addEventListener('click',()=>$('pop').style.display='none');
$('m1').onclick=e=>{
  e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();
  popup([{h:'@'+me.username+' · ☁ '+(gst||'—')},{t:'☁ Sync now',f:syncNow},{t:'✎ New message',f:newDlg},{t:'⎋ Log out',f:logout,d:1}],r.left-150,r.bottom);
};
function msgMenu(m,x,y){
  const it=[{t:'↩ Reply',f:()=>setReply(m)}];
  if(m.text)it.push({t:'⧉ Copy',f:()=>navigator.clipboard&&navigator.clipboard.writeText(m.text)});
  it.push({t:'🗑 Delete',f:()=>del(m),d:1});
  popup(it,x,y);
}
function setReply(m){replyTo=m;$('rn').textContent=m.out?'You':m.from;$('rt').textContent=prev(m)||'Message';$('rbar').style.display='flex';$('inp').focus()}
$('rx').onclick=()=>{replyTo=null;$('rbar').style.display='none'};
const rm=m=>{const c=data.chats[active];c.msgs=c.msgs.filter(x=>x!==m);save();render()};
async function del(m){
  try{await api('deleteMessage',{chat_id:active,message_id:m.id});rm(m)}
  catch(e){if(confirm('Telegram could not delete it: '+e.message+'\n\nRemove it from this view only?'))rm(m)}
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2400)}

function outMsg(r,text,rep){
  const c=ensure(r.chat);
  c.msgs.push({id:r.message_id,from:'You',uid:0,text,date:r.date*1000,out:true,reply:rep||null});
  save();return String(r.chat.id);
}
async function send(){
  const t=$('inp').value.trim();if(!t||active===null)return;
  const p={chat_id:active,text:t};if(replyTo)p.reply_to_message_id=replyTo.id;
  $('send').disabled=true;
  try{
    const r=await api('sendMessage',p);
    outMsg(r,t,replyTo?{from:replyTo.out?'You':replyTo.from,t:prev(replyTo)||'Message'}:null);
    $('inp').value='';$('inp').style.height='';replyTo=null;$('rbar').style.display='none';render();
  }catch(e){alert('Could not send: '+e.message)}
  $('send').disabled=false;
}
$('send').onclick=send;
$('inp').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'};
$('inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>760){e.preventDefault();send()}};

function newDlg(){$('nerr').textContent='';$('modal').classList.add('on');$('nto').focus()}
$('fab').onclick=newDlg;$('ncancel').onclick=()=>$('modal').classList.remove('on');

$('dw').onclick=async()=>{try{await api('deleteWebhook');$('warn').style.display='none';poll()}catch(e){alert(e.message)}};

/* ---------- Device cache (IndexedDB) ----------
   The AES key is stored as a NON-extractable CryptoKey, so this browser can use it
   but nobody can copy the key itself out. Chats on disk are always encrypted. */
const idb=(mode,fn)=>new Promise((res,rej)=>{
  const o=indexedDB.open('botmsg',1);
  o.onupgradeneeded=()=>o.result.createObjectStore('k');
  o.onerror=()=>rej(o.error);
  o.onsuccess=()=>{const db=o.result,tx=db.transaction('k',mode),r=fn(tx.objectStore('k'));tx.oncomplete=()=>{db.close();res(r&&r.result)};tx.onerror=()=>rej(tx.error)};
});
const idbGet=k=>idb('readonly',s=>s.get(k)),idbSet=(k,v)=>idb('readwrite',s=>s.put(v,k)),idbDel=k=>idb('readwrite',s=>s.delete(k));

/* ---------- Crypto ---------- */
const b64=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function gz(bytes,dir){
  const st=new Blob([bytes]).stream().pipeThrough(dir==='c'?new CompressionStream('gzip'):new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function seal(obj){
  let bytes=new TextEncoder().encode(JSON.stringify(obj)),z=0;
  if(window.CompressionStream){bytes=await gz(bytes,'c');z=1}
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},gKey,bytes);
  return JSON.stringify({v:1,z,salt:b64(gSalt),iv:b64(iv),ct:b64(ct)});
}
async function decrypt(txt,key){
  const f=JSON.parse(txt);
  let bytes=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(f.iv)},key,unb64(f.ct)));
  if(f.z)bytes=await gz(bytes,'d');
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ---------- Google Drive backup ---------- */
const CLIENT_ID='1065048729652-ga0d410g3ue25puptsvmb1j1nfs347ki.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/drive.appdata',FILE='bot-messenger.enc',DRIVE='https://www.googleapis.com/drive/v3/files';
let gAccess='',gExp=0,gWait=null,gKey=null,gSalt=null,gFileId=null,gText=null,gTimer=0,busy=false;
let ts=0,sts=0,lDirty=false,gDirty=false,gst='';
const gOk=()=>Date.now()<gExp;
function setSt(t){gst=t;updBar()}
function updBar(){$('gbar').style.display=(me&&!gOk())?'flex':'none'}
setInterval(updBar,30000);
function step(n){['s1','s2','s3'].forEach((id,i)=>$(id).style.display=i+1===n?'block':'none');$('lerr').textContent=''}

function gAuth(prompt){
  return new Promise((res,rej)=>{
    const fail=m=>{const e=new Error(m);e.auth=true;rej(e)};
    if(!window.google||!google.accounts)return fail('Google library not loaded');
    google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID,scope:SCOPE,
      callback:r=>{if(r.error)return fail(r.error_description||r.error);gAccess=r.access_token;gExp=Date.now()+(r.expires_in-60)*1000;updBar();res(gAccess)},
      error_callback:e=>fail('Google sign-in: '+(e.type||'cancelled'))
    }).requestAccessToken({prompt});
  });
}
async function drive(url,opt={}){
  if(!gOk()){const e=new Error('Not signed in to Google');e.auth=true;throw e}
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({},opt.headers,{Authorization:'Bearer '+gAccess})}));
  if(r.status===401){gExp=0;updBar();const e=new Error('Google session expired');e.auth=true;throw e}
  if(!r.ok)throw new Error('Drive error '+r.status);
  return r;
}
async function findFile(){
  const r=await(await drive(DRIVE+'?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='"+FILE+"'"))).json();
  return r.files[0]?r.files[0].id:null;
}
async function upload(blob){
  const bd='bm'+Date.now(),meta=gFileId?{}:{name:FILE,parents:['appDataFolder']};
  const mp='--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+blob+'\r\n--'+bd+'--';
  const url='https://www.googleapis.com/upload/drive/v3/files'+(gFileId?'/'+gFileId:'')+'?uploadType=multipart&fields=id';
  const r=await(await drive(url,{method:gFileId?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp})).json();
  gFileId=r.id;
}
const store=blob=>idbSet('state',{key:gKey,salt:b64(gSalt),fileId:gFileId,sts,blob}).catch(()=>{});

/* save(): data changed. save(1): only local view state (unread counts) changed */
function save(localOnly){
  if(!gKey)return;lDirty=true;
  if(!localOnly){ts=Date.now();gDirty=true}
  clearTimeout(gTimer);gTimer=setTimeout(flush,2500);
}
async function flush(){
  while(busy)await new Promise(r=>setTimeout(r,150));
  if(!gKey||!(lDirty||gDirty))return true;
  busy=true;let ok=true;
  try{
    const bts=ts,blob=await seal({token,data,ts:bts});
    lDirty=false;await store(blob);
    if(gDirty){
      if(!gOk()){ok=false;setSt('not backed up')}
      else{
        gDirty=false;setSt('saving…');
        try{await upload(blob);sts=bts;await store(blob);setSt('synced')}
        catch(e){gDirty=true;ok=false;setSt(e.auth?'sign in again':'not synced')}
      }
    }
  }catch(e){ok=false}
  busy=false;
  if(gDirty&&gOk()){clearTimeout(gTimer);gTimer=setTimeout(flush,ok?3000:20000)}
  return ok;
}
function merge(r){
  for(const[id,c]of Object.entries(r.chats||{})){
    const t=data.chats[id];if(!t){data.chats[id]=c;continue}
    const k=x=>x.id+(x.out?'o':'i'),seen=new Set(t.msgs.map(k));
    c.msgs.forEach(x=>{if(!seen.has(k(x)))t.msgs.push(x)});t.msgs.sort((a,b)=>a.date-b.date);
  }
  data.offset=Math.max(data.offset||0,r.offset||0);
}
async function connectGoogle(){
  try{
    setSt('connecting…');await gAuth('');
    const id=await findFile();
    if(id){
      gFileId=id;
      const txt=await(await drive(DRIVE+'/'+id+'?alt=media')).text();
      let rem=null;
      try{rem=await decrypt(txt,gKey)}catch(e){
        if(!confirm('The Drive backup was made with a different passphrase and cannot be opened here. Replace it with the data on this device?')){setSt('not backed up');return}
      }
      if(rem&&(rem.ts||0)>sts){merge(rem);sts=rem.ts||0;ts=Date.now();lDirty=true;render()}
    }
    if(!id||ts>sts)gDirty=true;
    lDirty=true;
    const ok=await flush();toast(ok?'Backed up to Google Drive':'Could not back up');
  }catch(e){setSt('not backed up');toast(e.message)}
  updBar();
}
function syncNow(){if(!gOk())return connectGoogle();gDirty=true;return flush().then(ok=>toast(ok?'Synced to Google Drive':'Sync failed'))}
$('gc').onclick=connectGoogle;
addEventListener('pagehide',()=>{if(lDirty||gDirty)flush()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(lDirty||gDirty)){clearTimeout(gTimer);flush()}});

/* ---------- Sign-in flow ---------- */
$('gsi').onclick=async()=>{
  $('lerr').textContent='';
  if(CLIENT_ID.startsWith('YOUR_')){$('lerr').textContent='Set CLIENT_ID in the code first.';return}
  try{
    await gAuth('');
    gFileId=await findFile();
    gText=gFileId?await(await drive(DRIVE+'/'+gFileId+'?alt=media')).text():null;
    $('ptitle').textContent=gText?'Enter your passphrase to unlock your backup.':'Create a passphrase. It encrypts your data before it leaves this device.';
    $('pp2').style.display=gText?'none':'block';
    step(2);$('pp').focus();
  }catch(e){$('lerr').textContent=e.message}
};
$('pp').onkeydown=$('pp2').onkeydown=e=>{if(e.key==='Enter')$('pgo').click()};
$('pgo').onclick=async()=>{
  const p=$('pp').value;$('lerr').textContent='';if(!p)return;
  $('pgo').disabled=true;
  try{
    if(gText){
      const f=JSON.parse(gText),salt=unb64(f.salt),key=await deriveKey(p,salt);let j;
      try{j=await decrypt(gText,key)}catch(e){throw new Error('Wrong passphrase')}
      gSalt=salt;gKey=key;
      data=j.data&&j.data.chats?j.data:{chats:{},offset:0};ts=sts=j.ts||0;lDirty=true;
      if(j.token)await connect(j.token,true);else step(3);
    }else{
      if(p.length<8)throw new Error('Use at least 8 characters');
      if(p!==$('pp2').value)throw new Error('Passphrases do not match');
      gSalt=crypto.getRandomValues(new Uint8Array(16));gKey=await deriveKey(p,gSalt);
      step(3);$('tok').focus();
    }
  }catch(e){$('lerr').textContent=e.message}
  $('pgo').disabled=false;
};
$('go').onclick=()=>connect($('tok').value);
$('tok').onkeydown=e=>{if(e.key==='Enter')connect($('tok').value)};

async function connect(t,restored){
  token=t.trim();$('lerr').textContent='';if(!token)return;
  try{
    try{me=await api('getMe')}catch(e){if(restored&&e instanceof TypeError)me={username:'bot'};else throw e}
    if(!restored){try{const old=JSON.parse(localStorage.getItem('tgm_'+me.id));if(old&&old.chats)data=old}catch(e){}}
    $('login').style.display='none';$('app').style.display='grid';$('main').classList.add('none');render();poll();updBar();
    if(!restored)save();
    if(!restored||lDirty)flush().then(ok=>{if(ok&&!restored)try{Object.keys(localStorage).filter(k=>k.startsWith('tgm_')).forEach(k=>localStorage.removeItem(k))}catch(e){}});
  }catch(e){step(3);$('lerr').textContent='Connection failed: '+e.message}
}
async function logout(){
  if(!confirm('Log out of this device? Your chats stay encrypted in your Google Drive.'))return;
  clearTimeout(gTimer);
  if((lDirty||gDirty)&&!(await flush())&&!confirm('Your latest changes are not backed up to Drive. Log out anyway?'))return;
  polling=false;if(ctrl)ctrl.abort();
  try{await idbDel('state')}catch(e){}
  token='';me=null;data={chats:{},offset:0};active=null;files={};avs={};pend={};
  gKey=gSalt=gFileId=gText=null;gAccess='';gExp=0;gDirty=lDirty=false;ts=sts=0;gst='';
  $('tok').value=$('pp').value=$('pp2').value='';$('msgs').innerHTML='';$('list').innerHTML='';
  document.body.classList.remove('co');$('app').style.display='none';$('login').style.display='flex';$('gbar').style.display='none';step(1);
}

/* ---------- Start: reopen from this device's encrypted cache, no login needed ---------- */
(async function boot(){
  step(1);
  try{
    const st=await idbGet('state');
    if(st&&st.key&&st.blob){
      gKey=st.key;gSalt=unb64(st.salt);gFileId=st.fileId||null;sts=st.sts||0;
      const j=await decrypt(st.blob,gKey);
      data=j.data&&j.data.chats?j.data:{chats:{},offset:0};ts=j.ts||0;gDirty=ts>sts;
      if(j.token){await connect(j.token,true);return}
    }
  }catch(e){}
  gKey=gSalt=gFileId=null;ts=sts=0;gDirty=lDirty=false;data={chats:{},offset:0};step(1);
})();
</script>
